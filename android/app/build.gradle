plugins {
    id "com.android.application"
}

android {
    namespace "com.riverstone.poker"
    compileSdk 35

    defaultConfig {
        applicationId "com.riverstone.poker"
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName "1.5.0"
    }

    sourceSets {
        main {
            // Package the existing game directly so browser and Android share one source.
            assets.srcDirs = ["../../dist"]
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
